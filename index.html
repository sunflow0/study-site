<!DOCTYPE html>
<html lang="th"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Language Study 🪼🌏</title>
<link href="https://fonts.googleapis.com/css2?family=Mali:wght@400;600&family=Nunito:wght@600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f3f9ff;--card:#fff;--ink:#35465c;--main:#a8d4ff;--soft:#dcedff;--deep:#6fb1f5;--line:#d3e6f8}
@media (prefers-color-scheme:dark){:root{--bg:#1d2733;--card:#2a3644;--ink:#e8f1fb;--main:#3d6d9e;--soft:#334a63;--deep:#5aa3e8;--line:#3f566e}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Mali','Nunito',sans-serif}
button{font:inherit;color:inherit;border:2px solid var(--line);background:var(--card);border-radius:14px;padding:9px 14px;cursor:pointer}
button.on{background:var(--main);border-color:var(--main);font-weight:600}
#side{position:fixed;top:0;left:0;bottom:0;width:200px;background:var(--card);border-right:2px solid var(--line);padding:64px 14px 16px;display:flex;flex-direction:column;gap:8px;transition:transform .3s;z-index:5;overflow-y:auto}
#side h3{margin:12px 0 2px;font-size:13px;opacity:.6;font-weight:600}
#side button{text-align:left;width:100%}
#menu{position:fixed;top:12px;left:12px;z-index:6;width:44px;height:44px;padding:0;font-size:20px;background:var(--main);border-color:var(--main)}
main{
  margin-left:200px;
  padding:16px 24px 40px;
  width:calc(100% - 200px);
  max-width:900px;
  transition:margin .3s;
}

body.closed main{
  margin-left:0;
  padding-left:68px;
  width:100%;
}
body.closed main{margin-left:0;padding-left:68px}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}

#search{
  width:100%;
  padding:12px 14px;
  border:2px solid var(--line);
  border-radius:14px;
  background:var(--card);
  color:var(--ink);
  font:inherit;
  margin:4px 0 10px;
}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}\n#search{width:100%;padding:12px 14px;border:2px solid var(--line);border-radius:14px;background:var(--card);color:var(--ink);font:inherit;margin:4px 0 10px}
.flip{
  width:100%;
  height:190px;
  perspective:800px;
  margin:14px 0;
  cursor:pointer;
}

.in{
  position:relative;
  width:100%;
  height:100%;
  transition:transform .5s;
  transform-style:preserve-3d;
}

.flip.f .in{
  transform:rotateY(180deg);
}

.face{
  position:absolute;
  inset:0;
  width:100%;
  backface-visibility:hidden;
  background:var(--main);
  border-radius:24px;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  padding:16px;
  text-align:center;
}

.back{
  transform:rotateY(180deg);
  background:var(--soft);
  border:2px solid var(--main);
}
.word{font-family:'Nunito',sans-serif;font-size:30px;font-weight:800}
.sub{opacity:.7;font-size:14px}
.row{display:flex;justify-content:center;gap:10px}
details{background:var(--card);border:2px solid var(--line);border-radius:18px;padding:12px 16px;margin:10px 0}
summary{font-weight:600;cursor:pointer}
.f{background:var(--soft);border-radius:10px;padding:4px 10px;display:inline-block;margin:8px 0;font-family:'Nunito',sans-serif}
.mis{font-size:14px;opacity:.85}
.hide{display:none}
@media(max-width:640px){main,body.closed main{margin-left:0;padding-left:68px}#side{box-shadow:4px 0 18px rgba(0,0,0,.15)}}
</style></head><body class="closed">
<button id="menu" aria-label="menu">☰</button>
<nav id="side">
<h3>ภาษา</h3><div id="lg" style="display:flex;flex-direction:column;gap:8px"></div>
<h3>หมวด</h3><button id="tv" class="on">📖 Vocab</button><button id="tg">✏️ Grammar</button>
</nav>
<main>
<h1 id="ttl">💙 Language Study</h1>
<div id="msg"></div>
<section id="vocab"><div class="chips" id="lv"></div><input id="search" type="search" placeholder="🔎 ค้นหาคำศัพท์ / Pinyin / ความหมายภาษาอังกฤษ" aria-label="ค้นหาคำศัพท์"><div id="vbody"></div></section>
<section id="grammar" class="hide"><div class="chips" id="pt"></div><div id="gbody"></div></section>
</main>
<script>
let D,lang,lv,pt,i=0,known={},query='';
try{known=JSON.parse(localStorage.getItem('known')||'{}')}catch(e){}
const $=id=>document.getElementById(id);
if(innerWidth>640)document.body.classList.remove('closed');
$('menu').onclick=()=>document.body.classList.toggle('closed');
const shut=()=>{if(innerWidth<=640)document.body.classList.add('closed')};
const esc=s=>String(s??'').replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));

fetch('data.json')
  .then(response => {
    if (!response.ok) throw new Error('โหลด data.json ไม่สำเร็จ');
    return response.json();
  })
  .then(async data => {
    D = data;

    try {
      const response = await fetch('hsk3_thai.json', {
        cache: 'no-cache'
      });

      if (!response.ok) {
        throw new Error('หาไฟล์ hsk3_thai.json ไม่พบ');
      }

      const thaiData = await response.json();

      // เพิ่มคำศัพท์ไทยโดยไม่ลบข้อมูลเดิม
      if (!D['中文']) {
        D['中文'] = { vocab: {}, grammar: {} };
      }

      if (!D['中文'].vocab) D['中文'].vocab = {};
      if (!D['中文'].grammar) D['中文'].grammar = {};

      let count = 0;

      for (const [category, words] of Object.entries(thaiData)) {
        if (!Array.isArray(words)) continue;

        D['中文'].vocab[category] = words.map(item => ({
          w: item.w || '',
          py: item.py || '',
          pos: item.pos || '—',
          th: item.th || '',
          en: item.en || '',
          ex: item.ex || ''
        }));

        count += words.length;
      }

      $('msg').textContent =
        `โหลดคำศัพท์พร้อมคำแปลไทยแล้ว ${count} รายการ 💙`;

    } catch (error) {
      console.error(error);
      $('msg').textContent = error.message;
    }

    setLang(Object.keys(D)[0]);
  })
  .catch(error => {
    console.error(error);
    $('msg').textContent = 'โหลดข้อมูลหลักไม่สำเร็จ: ' + error.message;
  });

function setLang(l) {
  lang = l;

  const vocabData = D[l].vocab || {};
  const grammarData = D[l].grammar || {};

  lv = Object.keys(vocabData)[0] || '';
  pt = Object.keys(grammarData)[0] || '';
  i = 0;

  $('ttl').textContent = '💙 ' + l;

  chips('lg', D, () => lang, k => {
    setLang(k);
    shut();
  });

  chips('lv', vocabData, () => lv, v => {
    lv = v;
    i = 0;
    vocab();
  });

  chips('pt', grammarData, () => pt, v => {
    pt = v;
    grammar();
  });

  vocab();
  grammar();
}
function chips(id,obj,get,set){const el=$(id);el.innerHTML='';Object.keys(obj).forEach(k=>{const b=document.createElement('button');b.textContent=k;b.className=get()===k?'on':'';b.onclick=()=>{set(k);if(id!=='lg')chips(id,obj,get,set)};el.append(b)})}
function vocab(){
const all=D[lang].vocab[lv];
const n=all.filter(x=>known[lang+lv+x.w]).length;
const q=query.trim().toLowerCase();
const L=all.filter(x=>!q||[x.w,x.py,x.pos,x.th,x.en,x.ex].some(v=>String(v||'').toLowerCase().includes(q)));
if(!L.length){$('vbody').innerHTML='<div class="sub">ไม่พบคำศัพท์ที่ค้นหา ลองเปลี่ยนคำค้นหาดูนะ</div>';return}
i=((i%L.length)+L.length)%L.length;
const c=L[i],k=lang+lv+c.w;
$('vbody').innerHTML=`<div class="sub" style="text-align:center">จำได้แล้ว ${n}/${all.length} · พบ ${L.length} คำ · การ์ด ${i+1}/${L.length}</div>
<div class="flip" id="fl"><div class="in"><div class="face"><div class="word">${esc(c.w)}</div><div class="sub">${c.py?esc(c.py)+' · ':''}${esc(c.pos)}</div></div><div class="face back"><div style="font-size:20px">${esc(c.th||c.en||'—')}</div><div class="sub" style="margin-top:8px">${c.th&&c.en?esc(c.en)+' · ':''}${esc(c.ex||'')}</div></div></div></div>
<div class="row"><button id="pv">◀</button><button id="kn" class="${known[k]?'on':''}">✓ จำได้</button><button id="nx">▶</button></div>`;
$('fl').onclick=e=>e.currentTarget.classList.toggle('f');
$('pv').onclick=()=>{i=(i-1+L.length)%L.length;vocab()};
$('nx').onclick=()=>{i=(i+1)%L.length;vocab()};
$('kn').onclick=()=>{known[k]=!known[k];try{localStorage.setItem('known',JSON.stringify(known))}catch(e){}vocab()}}
function grammar(){$('gbody').innerHTML=D[lang].grammar[pt].map(g=>`<details><summary>${g.t}</summary><div class="f">${g.f}</div>${g.ex.map(e=>`<div>• ${e}</div>`).join('')}<div class="mis">⚠️ ${g.mis}</div></details>`).join('')}
function show(v){$('vocab').classList.toggle('hide',!v);$('grammar').classList.toggle('hide',v);$('tv').className=v?'on':'';$('tg').className=v?'':'on';shut()}
$('search').addEventListener('input',e=>{query=e.target.value;i=0;vocab()});

async function loadThaiVocabulary() {
  try {
    const [mainResponse, thaiResponse] = await Promise.all([
      fetch('data.json', { cache: 'no-cache' }),
      fetch('hsk3_thai.json', { cache: 'no-cache' })
    ]);

    if (!mainResponse.ok) throw new Error('โหลด data.json ไม่สำเร็จ');
    if (!thaiResponse.ok) throw new Error('โหลด hsk3_thai.json ไม่สำเร็จ');

    D = await mainResponse.json();
    const thaiData = await thaiResponse.json();

    // ใช้ภาษาที่มีอยู่แล้ว ไม่สร้างภาษาใหม่โดยไม่จำเป็น
    const targetLang = Object.keys(D).find(
      key => D[key] && D[key].vocab
    );

    if (!targetLang) throw new Error('ไม่พบหมวด Vocab ใน data.json');

    let total = 0;

    for (const [category, words] of Object.entries(thaiData)) {
      if (!Array.isArray(words)) continue;

      D[targetLang].vocab[category] = words.map(item => ({
        w: item.w || '',
        py: item.py || '',
        pos: item.pos || '—',
        th: item.th || '',
        en: item.en || '',
        ex: item.ex || ''
      }));

      total += words.length;
    }

    setLang(targetLang);

    $('msg').textContent =
      `โหลดคำศัพท์ ${total} รายการแล้ว 💙`;

  } catch (error) {
    console.error(error);
    $('msg').textContent = 'เกิดข้อผิดพลาด: ' + error.message;
  }
}

loadThaiVocabulary();

$('tv').onclick=()=>show(true);$('tg').onclick=()=>show(false);
</script></body></html>
