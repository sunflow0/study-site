<!DOCTYPE html>
<html lang="th"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>English Study 🌷</title>
<link href="https://fonts.googleapis.com/css2?family=Mali:wght@400;600&family=Nunito:wght@600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#fff7fa;--card:#fff;--ink:#4a3f4b;--pink:#ffc8dd;--blue:#cde7ff;--mint:#d5f5e3;--line:#f1dce6}
@media (prefers-color-scheme:dark){:root{--bg:#2a2330;--card:#3a3042;--ink:#f5e9f3;--pink:#6b3f58;--blue:#3d5470;--mint:#3d6150;--line:#54445e}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Mali','Nunito',sans-serif;padding:16px;max-width:640px;margin:auto}
h1{font-family:'Nunito',sans-serif;font-size:22px;text-align:center}
.tabs,.chips{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin:12px 0}
button{font:inherit;color:inherit;border:2px solid var(--line);background:var(--card);border-radius:999px;padding:8px 16px;cursor:pointer}
button.on{background:var(--pink);border-color:var(--pink);font-weight:600}
.flip{height:190px;perspective:800px;margin:14px 0;cursor:pointer}
.in{position:relative;height:100%;transition:transform .5s;transform-style:preserve-3d}
.flip.f .in{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;background:var(--blue);border-radius:24px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:16px;text-align:center}
.back{transform:rotateY(180deg);background:var(--mint)}
.word{font-family:'Nunito',sans-serif;font-size:30px;font-weight:800}
.sub{opacity:.7;font-size:14px}
.row{display:flex;justify-content:center;gap:10px;align-items:center}
details{background:var(--card);border:2px solid var(--line);border-radius:18px;padding:12px 16px;margin:10px 0}
summary{font-weight:600;cursor:pointer}
.f{background:var(--pink);border-radius:10px;padding:4px 10px;display:inline-block;margin:8px 0;font-family:'Nunito',sans-serif}
.mis{font-size:14px;opacity:.85}
.hide{display:none}
</style></head><body>
<h1>🌷 Language Study</h1>
<div class="tabs" id="lg"></div>
<div class="tabs"><button id="tv" class="on">📖 Vocab</button><button id="tg">✏️ Grammar</button></div>
<div id="msg"></div>
<section id="vocab"><div class="chips" id="lv"></div><div id="vbody"></div></section>
<section id="grammar" class="hide"><div class="chips" id="pt"></div><div id="gbody"></div></section>
<script>
let D,lang,lv,pt,i=0,known={};
try{known=JSON.parse(localStorage.getItem('known')||'{}')}catch(e){}
const $=id=>document.getElementById(id);
fetch('data.json').then(r=>r.json()).then(d=>{D=d;setLang(Object.keys(d)[0])})
.catch(()=>$('msg').textContent='โหลด data.json ไม่ได้ (ต้องเปิดผ่านเว็บ เช่น Netlify ไม่ใช่เปิดไฟล์ตรงๆ)');
function setLang(l){lang=l;lv=Object.keys(D[l].vocab)[0];pt=Object.keys(D[l].grammar)[0];i=0;
chips('lg',D,()=>lang,setLang);chips('lv',D[l].vocab,()=>lv,v=>{lv=v;i=0;vocab()});chips('pt',D[l].grammar,()=>pt,v=>{pt=v;grammar()});vocab();grammar()}
function chips(id,obj,get,set){const el=$(id);el.innerHTML='';Object.keys(obj).forEach(k=>{const b=document.createElement('button');b.textContent=k;b.className=get()===k?'on':'';b.onclick=()=>{set(k);if(id!=='lg')chips(id,obj,get,set)};el.append(b)})}
function vocab(){const L=D[lang].vocab[lv],c=L[i],k=lang+lv+c.w,n=L.filter(x=>known[lang+lv+x.w]).length;
$('vbody').innerHTML=`<div class="sub" style="text-align:center">จำได้แล้ว ${n}/${L.length} · การ์ด ${i+1}/${L.length}</div>
<div class="flip" id="fl"><div class="in"><div class="face"><div class="word">${c.w}</div><div class="sub">${c.py?c.py+' · ':''}${c.pos}</div></div><div class="face back"><div style="font-size:20px">${c.th}</div><div class="sub" style="margin-top:8px">${c.ex}</div></div></div></div>
<div class="row"><button id="pv">◀</button><button id="kn" class="${known[k]?'on':''}">✓ จำได้</button><button id="nx">▶</button></div>`;
$('fl').onclick=e=>e.currentTarget.classList.toggle('f');
$('pv').onclick=()=>{i=(i-1+L.length)%L.length;vocab()};
$('nx').onclick=()=>{i=(i+1)%L.length;vocab()};
$('kn').onclick=()=>{known[k]=!known[k];try{localStorage.setItem('known',JSON.stringify(known))}catch(e){}vocab()}}
function grammar(){$('gbody').innerHTML=D[lang].grammar[pt].map(g=>`<details><summary>${g.t}</summary><div class="f">${g.f}</div>${g.ex.map(e=>`<div>• ${e}</div>`).join('')}<div class="mis">⚠️ ${g.mis}</div></details>`).join('')}
$('tv').onclick=()=>{$('vocab').classList.remove('hide');$('grammar').classList.add('hide');$('tv').className='on';$('tg').className=''};
$('tg').onclick=()=>{$('grammar').classList.remove('hide');$('vocab').classList.add('hide');$('tg').className='on';$('tv').className=''};
</script>
</body></html>
